name: Build EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: g++ main.cpp -o program.exe -static
      - name: Simpan hasil
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
